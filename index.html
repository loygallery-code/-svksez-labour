        <div class="form-field"><label>ໃບທະບຽນວິສາຫະກິດ - ເລກທີ</label><input type="text" id="dBizNo"></div>
        <div class="form-field"><label>ວັນທີ</label><input type="date" id="dBizDate"></div>
        <div class="form-field"><label>ໄຟລ (URL)</label><input type="text" id="dBizFile" placeholder="ລິ້ງ PDF/ຮູບ"></div>
      </div>
      <!-- Doc: ໃບອະນຸມັດໂຄຕ້າ -->
      <div class="form-row">
        <div class="form-field"><label>ໃບອະນຸມັດໂຄຕ້າ - ເລກທີ</label><input type="text" id="dFwQuotaNo"></div>
        <div class="form-field"><label>ວັນທີ</label><input type="date" id="dFwQuotaDate"></div>
      </div>
      <!-- Doc: ໃບອະນຸມັດໃຫ້ນຳເຂົ້າແຮງງານ ຕປທ -->
      <div class="form-row">
        <div class="form-field"><label>ໃບອະນຸມັດໃຫ້ນຳເຂົ້າແຮງງານ ຕປທ - ເລກທີ</label><input type="text" id="dFwImportNo"></div>
        <div class="form-field"><label>ວັນທີ</label><input type="date" id="dFwImportDate"></div>
      </div>
      <!-- Doc 3.2 -->
      <div class="form-row">
        <div class="form-field"><label>ໃບອະນຸຍາດລົງທຶນ - ເລກທີ</label><input type="text" id="dInvNo"></div>
        <div class="form-field"><label>ວັນທີ</label><input type="date" id="dInvDate"></div>
        <div class="form-field"><label>ໄຟລ (URL)</label><input type="text" id="dInvFile" placeholder="ລິ້ງ PDF/ຮູບ"></div>
      </div>
      <!-- Doc 3.3 -->
      <div class="form-row">
        <div class="form-field"><label>ໃບທະບຽນອາກອນ - ເລກທີ</label><input type="text" id="dTaxNo"></div>
        <div class="form-field"><label>ວັນທີ</label><input type="date" id="dTaxDate"></div>
        <div class="form-field"><label>ໄຟລ (URL)</label><input type="text" id="dTaxFile" placeholder="ລິ້ງ PDF/ຮູບ"></div>
      </div>
      <!-- Doc 3.4 -->
      <div class="form-row">
        <div class="form-field"><label>ໃບທະບຽນປະກັນສັງຄົມ - ເລກທີ</label><input type="text" id="dSocNo"></div>
        <div class="form-field"><label>ວັນທີ</label><input type="date" id="dSocDate"></div>
        <div class="form-field"><label>ໄຟລ (URL)</label><input type="text" id="dSocFile" placeholder="ລິ້ງ PDF/ຮູບ"></div>
      </div>
      <!-- Doc 3.5 (2yr) -->
      <div class="form-row">
        <div class="form-field"><label>ໃບອະນຸຍາດນຳໃຊ້ກົດລະບຽບ - ເລກທີ</label><input type="text" id="dRuleNo"></div>
        <div class="form-field"><label>ວັນທີ (ໝົດອາຍຸ 2 ປີ)</label><input type="date" id="dRuleDate" onchange="updateRuleStatus()"></div>
        <div class="form-field"><label>ໄຟລ (URL)</label><input type="text" id="dRuleFile" placeholder="ລິ້ງ PDF/ຮູບ"></div>
        <div class="form-field"><label>ສະຖານະ</label><input type="text" id="dRuleStatus" readonly style="background:#f5f5f5;"></div>
      </div>
      <!-- Doc 3.6 (1yr) -->
      <div class="form-row">
        <div class="form-field"><label>ໃບຢັ້ງຢືນກວດສຸຂະພາບ - ເລກທີ</label><input type="text" id="dHealthNo"></div>
        <div class="form-field"><label>ວັນທີ (ໝົດອາຍຸ 1 ປີ)</label><input type="date" id="dHealthDate" onchange="updateHealthStatus()"></div>
        <div class="form-field"><label>ໄຟລ (URL)</label><input type="text" id="dHealthFile" placeholder="ລິ້ງ PDF/ຮູບ"></div>
        <div class="form-field"><label>ສະຖານະ</label><input type="text" id="dHealthStatus" readonly style="background:#f5f5f5;"></div>
      </div>
      <!-- Extra docs -->
      <div class="section-title mt-4">ເອກະສານອື່ນໆ (ສູງສຸດ 5)</div>
      <div id="extraDocsContainer"></div>
      <button class="btn btn-secondary btn-sm" onclick="addExtraDoc()" id="addExtraDocBtn">+ ເພີ້ມເອກະສານ</button>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('companyModal')">ຍົກເລີກ</button>
      <button class="btn btn-primary" onclick="saveCompany()">💾 ບັນທຶກຂໍ້ມູນ</button>
    </div>
  </div>
</div>

<!-- RECORD MODAL (Monthly Stats) -->
<div class="modal-overlay" id="recordModal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">ບັນທຶກສະຖິຕິແຮງງານປະຈຳເດືອນ</span>
      <button class="close-btn" onclick="closeModal('recordModal')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="editRecordId">
      <input type="hidden" id="editRecordCompanyId">
      <div class="section-title">ຂໍ້ມູນຜູ້ໃຫ້ຂໍ້ມູນ</div>
      <div class="form-row">
        <div class="form-field">
          <label>ຄຳນຳໜ້າ</label>
          <select id="rPrefix">
            <option value="ທ້າວ">ທ້າວ</option>
            <option value="ນາງ">ນາງ</option>
          </select>
        </div>
        <div class="form-field"><label>ຊື່</label><input type="text" id="rFirstname" list="prevFirstnames"></div>
        <div class="form-field"><label>ນາມສະກຸນ</label><input type="text" id="rLastname" list="prevLastnames"></div>
      </div>
      <datalist id="prevFirstnames"></datalist>
      <datalist id="prevLastnames"></datalist>
      <div class="form-row">
        <div class="form-field">
          <label>ໜ້າທີ່ຮັບຜິດຊອບ</label>
          <select id="rRole" onchange="toggleRoleOther()">
            <option value="ຝ່າຍບຸກຄະລາກອນ">ຝ່າຍບຸກຄະລາກອນ</option>
            <option value="ຝ່າຍບໍລິຫານ">ຝ່າຍບໍລິຫານ</option>
            <option value="ອື່ນໆ">ອື່ນໆ</option>
          </select>
        </div>
        <div class="form-field" id="roleOtherField" style="display:none;">
          <label>ໜ້າທີ່ (ກຳນົດເອງ)</label>
          <input type="text" id="rRoleOther">
        </div>
        <div class="form-field">
          <label>ວັນທີໃຫ້ຂໍ້ມູນ</label>
          <input type="date" id="rDataDate">
        </div>
      </div>
      <div class="form-row">
        <div class="form-field">
          <label>ເດືອນ</label>
          <select id="rMonth">
            <option value="1">ມັງກອນ</option><option value="2">ກຸມພາ</option>
            <option value="3">ມີນາ</option><option value="4">ເມສາ</option>
            <option value="5">ພຶດສະພາ</option><option value="6">ມິຖຸນາ</option>
            <option value="7">ກໍລະກົດ</option><option value="8">ສິງຫາ</option>
            <option value="9">ກັນຍາ</option><option value="10">ຕຸລາ</option>
            <option value="11">ພະຈິກ</option><option value="12">ທັນວາ</option>
          </select>
        </div>
        <div class="form-field">
          <label>ປີ</label>
          <input type="number" id="rYear" value="2025" min="2020" max="2099">
        </div>
      </div>

      <div class="section-title mt-4">ສະຖິຕິແຮງງານລາວ</div>
      <div class="form-row">
        <div class="form-field"><label>ຊາຍ</label><input type="number" id="rLaoMale" value="0" min="0" oninput="calcLaoTotal()"></div>
        <div class="form-field"><label>ຍິງ</label><input type="number" id="rLaoFemale" value="0" min="0" oninput="calcLaoTotal()"></div>
        <div class="form-field"><label>ລວມ (ອັດຕະໂນມັດ)</label><input type="number" id="rLaoTotal" readonly style="background:#f5f5f5;font-weight:bold;"></div>
      </div>

      <div class="section-title mt-4">ສະຖິຕິແຮງງານຕ່າງປະເທດ</div>
      <div id="foreignWorkerRows"></div>
      <button class="btn btn-secondary btn-sm mt-4" onclick="addForeignRow()">+ ເພີ້ມສັນຊາດ</button>
      <div class="form-row mt-4">
        <div class="form-field"><label>ລວມຕ່າງປະເທດຊາຍ</label><input type="number" id="rForeignMaleTotal" readonly style="background:#f5f5f5;font-weight:bold;"></div>
        <div class="form-field"><label>ລວມຕ່າງປະເທດຍິງ</label><input type="number" id="rForeignFemaleTotal" readonly style="background:#f5f5f5;font-weight:bold;"></div>
        <div class="form-field"><label>ລວມຕ່າງປະເທດທັງໝົດ</label><input type="number" id="rForeignTotal" readonly style="background:#f5f5f5;font-weight:bold;"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('recordModal')">ຍົກເລີກ</button>
      <button class="btn btn-primary" onclick="saveRecord()">💾 ບັນທຶກຂໍ້ມູນ</button>
    </div>
  </div>
</div>

<!-- PASSWORD CHANGE MODAL -->
<div class="modal-overlay" id="pwModal">
  <div class="modal" style="max-width:400px;">
    <div class="modal-header">
      <span class="modal-title">ປ່ຽນລະຫັດຜ່ານ</span>
      <button class="close-btn" onclick="closeModal('pwModal')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-field mb-4"><label>ບໍລິສັດ</label><input type="text" id="pwCompanyName" readonly style="background:#f5f5f5;"></div>
      <div class="form-field mb-4">
        <label>ລະຫັດຜ່ານໃໝ່ (ອັດຕະໂນມັດ)</label>
        <div style="display:flex;gap:8px;">
          <input type="text" id="pwNew" readonly style="background:#f5f5f5;flex:1;">
          <button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById('pwNew').value = generateRandomPassword();">🔀 ສ້າງໃໝ່</button>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('pwModal')">ຍົກເລີກ</button>
      <button class="btn btn-primary" onclick="savePassword()">💾 ບັນທຶກ</button>
    </div>
    <input type="hidden" id="pwCompanyId">
  </div>
</div>


<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
